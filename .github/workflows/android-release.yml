name: Android build & release

# Builds a release-signed APK for Forge and publishes it as a GitHub Release with a
# version.json manifest, so the phone can pull the latest build from the in-app
# Settings > Check for updates button.
#
# deploy-android.sh stays the in-hand dev loop (wireless adb over Tailscale). This is
# the delivery path — see TODO.md Epic 9 and AGENTS.md.

on:
  push:
    branches: [main]
    # Documentation-only commits must not produce a build. Every run publishes a
    # release the phone will offer as an update, and "update available: fixed a
    # typo in TODO.md" is noise the user has to dismiss on their phone.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

# Each build is its own release. Serialise so concurrent merges cannot race the
# run-number-derived version code or clobber each other's release assets.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write # create releases + upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Pure-logic tests. They need no emulator, so there is no excuse to skip them.
      - name: Test
        run: dotnet test Forge/Forge.Tests/Forge.Tests.csproj --configuration Release

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/forge-release.keystore"
          # Sanity check the decode without printing anything sensitive.
          test -s "$RUNNER_TEMP/forge-release.keystore"

      - name: Publish release-signed APK
        env:
          # AndroidSigning*Pass read these through the env: prefix below, so the secret
          # values never reach a command line or the logs.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish Forge/Forge/Forge.csproj \
            -f net9.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/forge-release.keystore" \
            -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD

      - name: Assemble release artifacts
        id: artifacts
        run: |
          set -euo pipefail
          PUBDIR=Forge/Forge/bin/Release/net9.0-android/publish
          SIGNED=$(find "$PUBDIR" -name '*-Signed.apk' 2>/dev/null | head -1)
          if [ -z "$SIGNED" ]; then
            # Some publish layouts drop the APK outside publish/.
            SIGNED=$(find Forge/Forge/bin/Release/net9.0-android -name '*-Signed.apk' | head -1)
          fi
          if [ -z "$SIGNED" ]; then
            echo "::error::No release-signed APK found under bin/Release/net9.0-android" >&2
            find Forge/Forge/bin/Release/net9.0-android -name '*.apk' >&2 || true
            exit 1
          fi

          VERSION_NAME=$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' Forge/Forge/Forge.csproj)
          VERSION_CODE=${{ github.run_number }}
          SHA=${{ github.sha }}
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES=$(git log -1 --pretty=%s)
          TAG="android-build-${VERSION_CODE}"
          APK_NAME="forge-${VERSION_NAME}-${VERSION_CODE}.apk"

          mkdir -p dist
          cp "$SIGNED" "dist/${APK_NAME}"
          jq -n \
            --arg version_name "$VERSION_NAME" \
            --argjson version_code "$VERSION_CODE" \
            --arg sha "$SHA" \
            --arg built_at "$BUILT_AT" \
            --arg notes "$NOTES" \
            --arg apk "$APK_NAME" \
            '{version_name:$version_name, version_code:$version_code, sha:$sha, built_at:$built_at, notes:$notes, apk:$apk}' \
            > dist/version.json

          {
            echo "tag=$TAG"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "apk_name=$APK_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "Built $APK_NAME (versionCode $VERSION_CODE) — manifest:"
          cat dist/version.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.artifacts.outputs.tag }}
          VERSION_NAME: ${{ steps.artifacts.outputs.version_name }}
          VERSION_CODE: ${{ steps.artifacts.outputs.version_code }}
          APK_NAME: ${{ steps.artifacts.outputs.apk_name }}
        run: |
          set -euo pipefail
          TITLE="Forge Android ${VERSION_NAME} (build ${VERSION_CODE})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/${APK_NAME}" dist/version.json --clobber
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "Release-signed Android build from ${GITHUB_SHA}. Install from the app's Settings screen. The first release build needs a one-time uninstall of any debug build (signature mismatch) — this deletes local data." \
              "dist/${APK_NAME}" dist/version.json
          fi
          echo "Release: $(gh release view "$TAG" --json url -q .url)"
